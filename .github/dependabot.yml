version: 2

# Target `development`, not the default branch.
#
# Dependabot defaults to the repo default branch, which here is `main` — and
# main auto-deploys to production. On 2026-08-25 a 57-package bump therefore
# went straight to all three production frontends, client included, without
# ever passing through staging. Targeting development restores the intended
# path: development -> staging -> verify -> main -> production.

# Weekly and grouped, because this repo has one maintainer — a PR per dependency
# per day is noise that gets ignored, which is worse than no alerts at all.
# Security updates still arrive immediately via GitHub's separate path.
#
# Next.js and React are ungrouped on purpose: their majors carry migrations and
# deserve to be looked at one at a time, not folded into a bulk bump.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # react and react-dom are a matched pair: react-dom@X requires react@^X,
      # so bumping either alone gives `npm error ERESOLVE could not resolve`
      # and the PR can never go green. They must move together, in their own
      # group rather than folded into the bulk one — a React change deserves
      # to be looked at on its own.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns:
          ["next", "react", "react-dom", "@types/react", "@types/react-dom"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
