name: Deploy Production

# LendyPH SaaS — PRODUCTION frontend.
#   domain   : app.lendyph.com
#   dir      : /var/www/lendyph-com-frontend   (VPS 76.13.22.110)
#   branch   : main
#   pm2 app  : lendyph-com-frontend            (upstream 127.0.0.1:3030)
#
# The on-VPS /var/www/lendyph-com-frontend/deploy.sh owns the build (fetch/reset
# to origin/main, `npm ci`, `NODE_OPTIONS=--max-old-space-size=3072 npm run
# build` — this box swaps hard, ~3.0G/4.0G, and a default heap OOMs the Next
# build — then `pm2 restart --update-env || pm2 start` and `pm2 save`).
# NOTE: NEXT_PUBLIC_* values are inlined at BUILD time, so a .env edit on the
# VPS does nothing until this runs again.
on:
  push:
    branches: [main]
    # CI-only changes (e.g. edits to these workflows) shouldn't redeploy prod.
    paths-ignore: ['.github/**']
  # Manual re-deploy / rollback path: re-runs the idempotent deploy against
  # whatever origin/main points at now, without needing an empty commit.
  workflow_dispatch:

# Two overlapping deploys would `git reset --hard` the checkout out from under
# a running `npm run build`, and two concurrent builds would exhaust memory on
# this box. Queue them; never cancel a deploy mid-flight.
concurrency:
  # Per-deployment, NOT shared across workflows.
  #
  # A single shared group looked like it would serialize builds, but GitHub
  # cancels an older *pending* run when a newer one joins the same group even
  # with cancel-in-progress: false. With three deploys that silently dropped the
  # middle one — on 2026-08-25 `Deploy binhs-coop` was cancelled and the client's
  # production frontend simply never got the update.
  #
  # Serialization belongs on the box, not in GitHub: the deploy steps below take
  # an flock, so concurrent deploys queue instead of racing for memory. Queuing
  # is what we wanted; cancelling never was.
  group: deploy-production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production (app.lendyph.com)
    runs-on: ubuntu-latest

    # The on-VPS deploy script is defined once and reused by both the initial
    # attempt and the transient-failure retry below, so the two never drift.
    env:
      DEPLOY_SCRIPT: |
        set -e

        # Stamped before anything else — before the flock in particular, so a long
        # queue wait behind another frontend build cannot make a real build look
        # stale. The build-freshness assertion at the end compares against this to
        # tell "the build ran during THIS deploy" from "this is last deploy's
        # output, still sitting on disk".
        DEPLOY_STARTED=$(date +%s)

        APP=lendyph-com-frontend
        DEPLOY_DIR=/var/www/lendyph-com-frontend
        DEPLOY_BRANCH=main

        # Assert the pm2 app exists BEFORE the deploy touches the build output.
        # A stale app name here once left the site 500ing on every chunk: the
        # build had already replaced .next, but the restart silently matched
        # nothing. deploy.sh recreates a missing pm2 entry, so this is a
        # tripwire for a *renamed* app rather than a hard gate.
        echo "=== Checking pm2 app '$APP' exists ==="
        pm2 describe "$APP" > /dev/null || echo "WARNING: pm2 app '$APP' not found; deploy.sh will recreate it"

        flock -w 2400 /var/lock/lendyph-frontend-build.lock bash /var/www/lendyph-com-frontend/deploy.sh

        # Fail loudly if the app did not come back up — a half-restarted Next
        # server serves 500s happily. deploy.sh now checks this too; kept here
        # because that script is unversioned and this is the copy under review.
        echo "=== Verifying '$APP' is online ==="
        pm2 describe "$APP" | grep -q "status.*online"

        # --- Did this deploy actually land? -----------------------------------------
        # Nothing here used to assert the OUTCOME of a deploy. A green job proved that
        # ssh connected and the deploy script exited 0 — not that the checkout moved.
        # Every production verification this week was done by hand (reading /api/health,
        # or `git rev-parse HEAD` over ssh) precisely because the job could not answer
        # it: `Deploy Portfolio` failed with `dial tcp :22 i/o timeout` and its re-run
        # failed the same way, four attempts across two runs; five other jobs failed on
        # four occasions in one day and every one was fixed by a re-run with nothing
        # changed; and a `Deploy binhs-coop` run was once dropped outright by a shared
        # concurrency group, leaving the client's production frontend simply never
        # updated. A box left on old code still returns HTTP 200 and still looks
        # healthy from every angle except the deployed commit.
        #
        # Deliberately NOT an equality test against this run's commit. The deploy does
        # `git fetch origin <branch>` + `git reset --hard origin/<branch>`, so it ships
        # the branch tip AT THE MOMENT IT RUNS, not the commit that triggered this run;
        # and the concurrency group queues deploys rather than cancelling them, so a
        # queued older run can legitimately ship newer code. Ancestry is the honest
        # assertion: HEAD must CONTAIN this run's commit, and is allowed to be ahead.
        #
        # This lives in the workflow rather than in deploy.sh because the on-VPS scripts
        # are unversioned — they exist only on the box and can change without review.
        # This is the copy that goes through review.
        echo "=== Verifying $DEPLOY_DIR advanced to contain $EXPECTED_SHA ==="
        cd "$DEPLOY_DIR"

        if [ -z "${EXPECTED_SHA:-}" ]; then
          echo "DEPLOY VERIFICATION FAILED: EXPECTED_SHA never reached the box."
          echo "It travels via the ssh-action's envs: input — check it is listed there."
          exit 1
        fi

        DEPLOYED_SHA=$(git rev-parse HEAD)

        if [ "${EXPECTED_REF:-}" != "$DEPLOY_BRANCH" ]; then
          # This run's ref is NOT the branch this directory tracks, so this run's commit
          # is not expected to appear in this history at all and ancestry would be a
          # guaranteed false failure. Not hypothetically: workflow_dispatch defaults to
          # the repository's default branch, which is `main` in both repos, and `main`
          # is PERMANENTLY ahead of `development` here — every promotion merges
          # development -> main through a GitHub merge commit that is never merged back,
          # so origin/main's tip is by construction never an ancestor of development.
          # Measured 2026-09-16: 6 such commits in the backend, 10 in the frontend, with
          # 0 flowing the other way. A hand-dispatched staging deploy — which is how
          # binhs-coop is actually released — would therefore fail EVERY time on a
          # deploy that did exactly the right thing. `git fetch origin <branch>` also
          # fetches only that one ref, so the other branch's object may not exist on the
          # box at all (/var/www/binhs-coop-backend and /var/www/lendyph-backend have no
          # refs/remotes/origin/development), which would fail with a confusing
          # "Not a valid commit name" instead.
          #
          # Assert what is still true and still worth asserting: the reset landed on the
          # tip the deploy just fetched, in this same ssh session.
          echo "NOTE: this run is on '${EXPECTED_REF:-<unset>}' but $DEPLOY_DIR tracks '$DEPLOY_BRANCH',"
          echo "      so ancestry is not assertable here; asserting HEAD == origin/$DEPLOY_BRANCH instead."
          BRANCH_TIP=$(git rev-parse --verify --quiet "refs/remotes/origin/$DEPLOY_BRANCH" || true)
          if [ -z "$BRANCH_TIP" ] || [ "$DEPLOYED_SHA" != "$BRANCH_TIP" ]; then
            echo "DEPLOY VERIFICATION FAILED: HEAD is $DEPLOYED_SHA but origin/$DEPLOY_BRANCH is ${BRANCH_TIP:-<no such ref on this box>}."
            echo "The deploy reported success but the checkout is not on the tip it just fetched."
            exit 1
          fi
          echo "OK: $DEPLOY_DIR HEAD $DEPLOYED_SHA == origin/$DEPLOY_BRANCH"
        else
          # Checked separately from the ancestry test so a stale box gets a message that
          # says so, rather than git's "Not a valid commit name".
          if ! git cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null; then
            echo "DEPLOY VERIFICATION FAILED: $DEPLOY_DIR has no object for this run's commit $EXPECTED_SHA."
            echo "The fetch never brought it down, so this checkout cannot be serving it."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" "$DEPLOYED_SHA"; then
            echo "DEPLOY VERIFICATION FAILED: $DEPLOY_DIR is serving $DEPLOYED_SHA,"
            echo "which does not contain this run's commit $EXPECTED_SHA."
            echo "The deploy reported success but the checkout did not advance."
            exit 1
          fi
          echo "OK: $DEPLOY_DIR HEAD $DEPLOYED_SHA contains $EXPECTED_SHA"
        fi

        # --- Did the running process restart onto the NEW build? --------------------
        # The check above proves the CHECKOUT moved. It does not prove the server did.
        # The deploy runs `npm run build` (which rewrites .next/BUILD_ID) and then
        # `pm2 restart`; if that restart does not take, the OLD process keeps serving
        # the OLD bundle while git HEAD looks perfect — and the `status.*online`
        # assertion above still passes, because the process that is online is the stale
        # one. That is the gap this closes.
        #
        # Every timestamp compared below is read from THIS box's clock, in EPOCH
        # SECONDS, on purpose. The box runs Etc/UTC while git renders commit times in
        # the committer's +08:00 (Manila), so comparing `stat` output against a rendered
        # `git log --format=%cI` — or against %cI with the offset dropped — makes a
        # two-minute-old build look eight hours stale. Epoch (`%ct`, `stat -c %Y`,
        # pm2's pm_uptime) carries no offset, so there is nothing to convert and nothing
        # to get wrong. The human-readable lines print UTC on BOTH sides, labelled, so
        # they cannot be misread that way either.
        echo "=== Verifying '$APP' is serving the build this deploy produced ==="

        BUILD_ID_FILE="$DEPLOY_DIR/.next/BUILD_ID"
        if [ ! -f "$BUILD_ID_FILE" ]; then
          echo "DEPLOY VERIFICATION FAILED: $BUILD_ID_FILE does not exist — the Next build produced no output."
          exit 1
        fi

        BUILT_AT=$(stat -c %Y "$BUILD_ID_FILE")
        COMMIT_AT=$(git -C "$DEPLOY_DIR" log -1 --format=%ct HEAD)
        echo "deploy started : $(date -u -d "@$DEPLOY_STARTED" +%Y-%m-%dT%H:%M:%SZ) UTC"
        echo "HEAD committed : $(date -u -d "@$COMMIT_AT" +%Y-%m-%dT%H:%M:%SZ) UTC  (git renders this same instant as +08:00)"
        echo "build written  : $(date -u -d "@$BUILT_AT" +%Y-%m-%dT%H:%M:%SZ) UTC  (.next/BUILD_ID = $(cat "$BUILD_ID_FILE"))"

        # Gated on the deploy's own start time rather than on HEAD's commit time. Both
        # are read from this one clock, so a contributor's machine running minutes fast
        # cannot stamp a commit "after" a build that really did run and red a good
        # deploy — and this is the stronger claim anyway: it says the build ran during
        # THIS deploy, not merely that it postdates the commit.
        if [ "$BUILT_AT" -lt "$DEPLOY_STARTED" ]; then
          echo "DEPLOY VERIFICATION FAILED: .next/BUILD_ID was last written before this deploy began."
          echo "The checkout advanced but the build did not re-run; the bundle on disk is the previous one."
          exit 1
        fi

        # pm2 reports pm_uptime as milliseconds since epoch: when the current process
        # was spawned. `next start` reads .next/BUILD_ID at boot, so a process that
        # started before the build was written is, by definition, serving the old one.
        RESTARTED_MS=$(pm2 jlist 2>/dev/null | jq -r --arg app "$APP" '.[] | select(.name == $app) | .pm2_env.pm_uptime' 2>/dev/null || true)
        if [ -z "${RESTARTED_MS:-}" ] || [ "$RESTARTED_MS" = "null" ]; then
          echo "DEPLOY VERIFICATION FAILED: pm2 reports no start time for '$APP'."
          exit 1
        fi
        RESTARTED_AT=$((RESTARTED_MS / 1000))
        echo "pm2 restarted  : $(date -u -d "@$RESTARTED_AT" +%Y-%m-%dT%H:%M:%SZ) UTC  ('$APP')"

        if [ "$RESTARTED_AT" -lt "$BUILT_AT" ]; then
          echo "DEPLOY VERIFICATION FAILED: '$APP' has been running since before the build it is supposed to serve was written."
          echo "The build succeeded but the process never restarted onto it — it is still serving the previous bundle."
          exit 1
        fi

        echo "OK: '$APP' started $((RESTARTED_AT - BUILT_AT))s after the build it serves"

        echo "=== Production deployed at $(date) ==="

    steps:
      - name: Deploy to VPS via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        # github.sha and github.ref_name reach the box through the action's
        # envs: input rather than being interpolated into the script text, so
        # the remote shell receives them as real variables and there is no
        # template value for it to mis-quote or word-split.
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref_name }}
        with:
          envs: EXPECTED_SHA,EXPECTED_REF
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Bumped from the 30s default: a slow handshake should wait, not fail.
          timeout: 120s
          # Next builds on this box are slow under swap pressure.
          command_timeout: 20m
          script: ${{ env.DEPLOY_SCRIPT }}

      # The retry below used to fire ~2 min after the first attempt — inside the
      # same outage window — so both legs died together and the deploy shipped
      # nothing. Observed three times on 2026-08-19, each succeeding on a manual
      # re-run minutes later with nothing changed. The drops happen upstream of
      # the VPS: the errors quote the correct IP, ufw allows OpenSSH from
      # anywhere, fail2ban is not installed, and the box's own sshd journal has
      # no trace of the attempts. Waiting is the only lever we have from here.
      - name: Wait out the transient network window
        if: failure()
        run: sleep 240

      # The VPS has intermittently flaky inbound SSH (dial tcp :22 i/o timeout
      # while the box was healthy). appleboy/ssh-action does not retry on its
      # own and deploy.sh is idempotent, so retry once to ride out a blip
      # instead of leaving main merged-but-undeployed.
      - name: Deploy to VPS via SSH (retry on transient failure)
        if: failure()
        id: deploy_retry
        uses: appleboy/ssh-action@v1
        # github.sha and github.ref_name reach the box through the action's
        # envs: input rather than being interpolated into the script text, so
        # the remote shell receives them as real variables and there is no
        # template value for it to mis-quote or word-split.
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref_name }}
        with:
          envs: EXPECTED_SHA,EXPECTED_REF
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script: ${{ env.DEPLOY_SCRIPT }}

      # --- Does the public site answer at all? ------------------------------
      # Reachability ONLY, and deliberately labelled as such: this step is
      # WEAKER than the backend's equivalent and must not be read as parity.
      #
      # The backend can be asked which commit it is serving (GET /api/health).
      # This app cannot. It has no health route, and its App Router output
      # exposes no build id on the wire — the served HTML carries only
      # content-hashed /_next/static/chunks/* paths, with no /_next/static/
      # <buildId>/ segment and no __NEXT_DATA__ blob to read one out of
      # (checked live against staging-app.lendyph.com). So nothing in the
      # response identifies WHICH build answered, and a frontend quietly serving
      # a stale-but-working bundle passes this step.
      #
      # Catching that is the job of the two in-SSH assertions instead: the
      # checkout must contain this run's commit, and the pm2 process must have
      # started after the build it is meant to be serving. This step only adds
      # that the public hostname, TLS and reverse proxy are up and the app
      # renders.
      #
      # Follows redirects on purpose: / 307s to /login, and that target is a
      # real SSR render, so requiring a final 200 exercises more than a static
      # route.
      - name: Verify app.lendyph.com answers
        if: ${{ !cancelled() && (steps.deploy.outcome == 'success' || steps.deploy_retry.outcome == 'success') }}
        env:
          SITE_URL: https://app.lendyph.com/
        run: |
          set -uo pipefail

          ATTEMPTS=6
          attempt=0
          code=000

          while [ "$attempt" -lt "$ATTEMPTS" ]; do
            attempt=$((attempt + 1))
            # Truncated before every attempt: curl leaves the output file untouched
            # when the connection never opens (DNS failure, TLS failure, timeout), so
            # without this the failure report would print the PREVIOUS attempt's body
            # and read as though the host had answered.
            : > "$RUNNER_TEMP/site.html"
            code=$(curl -sS -L --max-time 20 -o "$RUNNER_TEMP/site.html" -w '%{http_code}' "$SITE_URL") || code=000

            if [ "$code" = "200" ]; then
              echo "ok: ${SITE_URL} -> HTTP 200 after redirects ($(wc -c <"$RUNNER_TEMP/site.html") bytes)"
              exit 0
            fi

            [ "$attempt" -lt "$ATTEMPTS" ] && { echo "attempt ${attempt}/${ATTEMPTS}: HTTP ${code} — retrying in 10s"; sleep 10; }
          done

          echo "::error title=Site did not answer::${SITE_URL} never returned 200 in ${ATTEMPTS} attempts (last: HTTP ${code})"
          echo "last response body (first 2000 bytes):"
          # `head` on an empty file succeeds, so test for content first —
          # otherwise a connection that never opened prints a bare header.
          if [ -s "$RUNNER_TEMP/site.html" ]; then head -c 2000 "$RUNNER_TEMP/site.html"; else echo "(no body captured)"; fi
          echo
          exit 1
