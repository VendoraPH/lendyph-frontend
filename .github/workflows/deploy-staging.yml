name: Deploy Staging

# LendyPH SaaS — STAGING frontend.
#   domain   : staging-app.lendyph.com
#   dir      : /var/www/lendyph-com-frontend-staging   (VPS 76.13.22.110)
#   branch   : development
#   pm2 app  : lendyph-com-frontend-staging            (upstream 127.0.0.1:3031)
#
# This workflow used to point at /var/www/lendyph-frontend-staging — the owner's
# personal portfolio demo — which meant the product had no staging deploy at
# all. The demo now lives in deploy-portfolio.yml and is manual-only.
#
# The on-VPS /var/www/lendyph-com-frontend-staging/deploy.sh owns the build
# (fetch/reset to origin/development, `npm ci`, `NODE_OPTIONS=
# --max-old-space-size=3072 npm run build` — this box swaps hard, ~3.0G/4.0G,
# and a default heap OOMs the Next build — then `pm2 restart --update-env ||
# pm2 start` and `pm2 save`).
# NOTE: NEXT_PUBLIC_* values are inlined at BUILD time, so a .env edit on the
# VPS does nothing until this runs again.
on:
  push:
    branches: [development]
    # CI-only changes (e.g. edits to these workflows) shouldn't redeploy staging.
    paths-ignore: ['.github/**']
  # Manual re-deploy path: re-runs the idempotent deploy against whatever
  # origin/development points at now, without needing an empty commit.
  workflow_dispatch:

# Two overlapping deploys would `git reset --hard` the checkout out from under
# a running `npm run build`, and two concurrent builds would exhaust memory on
# this box. Queue them; never cancel a deploy mid-flight.
concurrency:
  # Per-deployment, NOT shared across workflows.
  #
  # A single shared group looked like it would serialize builds, but GitHub
  # cancels an older *pending* run when a newer one joins the same group even
  # with cancel-in-progress: false. With three deploys that silently dropped the
  # middle one — on 2026-08-25 `Deploy binhs-coop` was cancelled and the client's
  # production frontend simply never got the update.
  #
  # Serialization belongs on the box, not in GitHub: the deploy steps below take
  # an flock, so concurrent deploys queue instead of racing for memory. Queuing
  # is what we wanted; cancelling never was.
  group: deploy-staging-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging (staging-app.lendyph.com)
    runs-on: ubuntu-latest

    # The on-VPS deploy script is defined once and reused by both the initial
    # attempt and the transient-failure retry below, so the two never drift.
    env:
      DEPLOY_SCRIPT: |
        set -e
        APP=lendyph-com-frontend-staging

        # Assert the pm2 app exists BEFORE the deploy touches the build output.
        # A stale app name here once left the site 500ing on every chunk: the
        # build had already replaced .next, but the restart silently matched
        # nothing. deploy.sh recreates a missing pm2 entry, so this is a
        # tripwire for a *renamed* app rather than a hard gate.
        echo "=== Checking pm2 app '$APP' exists ==="
        pm2 describe "$APP" > /dev/null || echo "WARNING: pm2 app '$APP' not found; deploy.sh will recreate it"

        flock -w 2400 /var/lock/lendyph-frontend-build.lock bash /var/www/lendyph-com-frontend-staging/deploy.sh

        # Fail loudly if the app did not come back up — a half-restarted Next
        # server serves 500s happily. deploy.sh now checks this too; kept here
        # because that script is unversioned and this is the copy under review.
        echo "=== Verifying '$APP' is online ==="
        pm2 describe "$APP" | grep -q "status.*online"

        echo "=== Staging deployed at $(date) ==="

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Bumped from the 30s default: a slow handshake should wait, not fail.
          timeout: 120s
          # Next builds on this box are slow under swap pressure.
          command_timeout: 20m
          script: ${{ env.DEPLOY_SCRIPT }}

      # The retry below used to fire ~2 min after the first attempt — inside the
      # same outage window — so both legs died together and the deploy shipped
      # nothing. Observed three times on 2026-08-19, each succeeding on a manual
      # re-run minutes later with nothing changed. The drops happen upstream of
      # the VPS: the errors quote the correct IP, ufw allows OpenSSH from
      # anywhere, fail2ban is not installed, and the box's own sshd journal has
      # no trace of the attempts. Waiting is the only lever we have from here.
      - name: Wait out the transient network window
        if: failure()
        run: sleep 240

      # The VPS has intermittently flaky inbound SSH (dial tcp :22 i/o timeout
      # while the box was healthy). appleboy/ssh-action does not retry on its
      # own and deploy.sh is idempotent, so retry once to ride out a blip
      # instead of leaving development merged-but-undeployed.
      - name: Deploy to VPS via SSH (retry on transient failure)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script: ${{ env.DEPLOY_SCRIPT }}
