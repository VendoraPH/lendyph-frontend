name: Deploy Portfolio

# LendyPH — PORTFOLIO frontend (the owner's personal demo, NOT a product
# environment).
#   domain   : lendyph-staging.abedubas.dev
#   dir      : /var/www/lendyph-frontend-staging   (VPS 76.13.22.110)
#   branch   : main
#   pm2 app  : lendyph-frontend-staging            (pre-existing name — do not rename)
#
# Manual-only on purpose. deploy-staging.yml used to fire on every push to
# `development` and deploy *this* directory, which put a personal demo box in
# the product's release train while the real environments got nothing. The real
# ones are now deploy-production.yml (app.lendyph.com) and deploy-staging.yml
# (staging-app.lendyph.com); refresh the demo from here when you want to.
#
# The on-VPS deploy.sh in this directory still pulls `development` and skips the
# raised Node heap, so the steps stay inline here rather than calling it.
on:
  push:
    # Tracks main, like the other production deployments. Previously
    # dispatch-only, which is why this box silently fell behind.
    branches: [main]
    paths-ignore: ['.github/**']
  workflow_dispatch:

# Never let two demo deploys interleave over the same checkout, and never let
# two Next builds compete for memory on this box.
concurrency:
  # Per-deployment, NOT shared across workflows.
  #
  # A single shared group looked like it would serialize builds, but GitHub
  # cancels an older *pending* run when a newer one joins the same group even
  # with cancel-in-progress: false. With three deploys that silently dropped the
  # middle one — on 2026-08-25 `Deploy binhs-coop` was cancelled and the client's
  # production frontend simply never got the update.
  #
  # Serialization belongs on the box, not in GitHub: the deploy steps below take
  # an flock, so concurrent deploys queue instead of racing for memory. Queuing
  # is what we wanted; cancelling never was.
  group: deploy-portfolio-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy portfolio demo (lendyph-staging.abedubas.dev)
    runs-on: ubuntu-latest

    # The on-VPS deploy script is defined once and reused by both the initial
    # attempt and the transient-failure retry below, so the two never drift.
    env:
      DEPLOY_SCRIPT: |
        set -e

        # Serialize with the other frontend deploys. All five frontends build on
        # the same 8 GB box; three concurrent `next build`s took it to 197 MB
        # free with swap at 4093/4095 on 2026-08-25. Held for the whole script
        # and released when it exits. This box has no deploy.sh, so the lock is
        # taken here rather than wrapping one.
        exec 9>/var/lock/lendyph-frontend-build.lock
        flock -w 2400 9

        APP=lendyph-frontend-staging

        cd /var/www/lendyph-frontend-staging

        # Assert the pm2 app exists BEFORE anything destructive. `rm -rf .next`
        # below deletes the chunks the running server is still serving, so if
        # the restart afterwards can't find the app, the site 500s on every
        # chunk until someone restarts it by hand. That is exactly what a
        # stale app name here caused once already — and because the old
        # script had no `set -e`, the job still reported green. Unlike the
        # lendyph-com-* deploy.sh scripts there is no `|| pm2 start` fallback
        # here, so this stays a hard gate.
        echo "=== Checking pm2 app '$APP' exists ==="
        pm2 describe "$APP" > /dev/null

        echo "=== Fetching latest ==="
        git fetch origin main
        # This checkout has historically tracked `development`; the demo now
        # follows `main`. `-f` throws away local edits (the box's own deploy.sh
        # did `git checkout -- .` for the same reason) and `-B` creates-or-
        # repoints a local `main` at origin/main, so this is idempotent
        # whichever branch the directory was last left on.
        echo "=== Resetting to match origin/main ==="
        git checkout -f -B main origin/main
        echo "=== Current commit ==="
        git log --oneline -1
        echo "=== Installing dependencies ==="
        npm install
        echo "=== Clearing Next.js cache ==="
        rm -rf .next
        # This box swaps hard (~3.0G/4.0G); the default heap OOMs the Next
        # build. Matches the ceiling the binhs-coop and lendyph-com deploys use.
        echo "=== Building ==="
        NODE_OPTIONS="--max-old-space-size=3072" npm run build
        echo "=== Restarting PM2 ==="
        pm2 restart "$APP" --update-env
        pm2 save

        # Fail loudly if the app did not come back up.
        echo "=== Verifying '$APP' is online ==="
        pm2 describe "$APP" | grep -q "status.*online"

        echo "=== Portfolio demo deployed at $(date) ==="

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Bumped from the 30s default: a slow handshake should wait, not fail.
          timeout: 120s
          # Next builds on this box are slow under swap pressure.
          command_timeout: 20m
          script: ${{ env.DEPLOY_SCRIPT }}

      # The retry below used to fire ~2 min after the first attempt — inside the
      # same outage window — so both legs died together and the deploy shipped
      # nothing. Observed three times on 2026-08-19, each succeeding on a manual
      # re-run minutes later with nothing changed. The drops happen upstream of
      # the VPS: the errors quote the correct IP, ufw allows OpenSSH from
      # anywhere, fail2ban is not installed, and the box's own sshd journal has
      # no trace of the attempts. Waiting is the only lever we have from here.
      - name: Wait out the transient network window
        if: failure()
        run: sleep 240

      # The VPS has intermittently flaky inbound SSH (dial tcp :22 i/o timeout
      # while the box was healthy). appleboy/ssh-action does not retry on its
      # own and the script is idempotent, so retry once to ride out a blip.
      - name: Deploy to VPS via SSH (retry on transient failure)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script: ${{ env.DEPLOY_SCRIPT }}
