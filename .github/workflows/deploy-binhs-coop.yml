name: Deploy binhs-coop (frontend)

# Manual-only deploys for the binhs-coop client instance.
#   staging    -> binhs-coop-staging.lendyph.com  (/var/www/binhs-coop-staging)
#   production -> binhs-coop.lendyph.com           (/var/www/binhs-coop)
# Both track the `development` branch (main is stale for the frontend).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which binhs-coop environment to deploy
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy binhs-coop ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script: |
            set -e
            if [ "${{ inputs.environment }}" = "production" ]; then
              bash /var/www/binhs-coop/deploy.sh
            else
              bash /var/www/binhs-coop-staging/deploy.sh
            fi
