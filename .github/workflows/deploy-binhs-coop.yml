name: Deploy binhs-coop (frontend)

# Deploys for the binhs-coop client instance.
#   staging    -> binhs-coop-staging.lendyph.com  (/var/www/binhs-coop-frontend-staging, branch development)
#   production -> binhs-coop.lendyph.com          (/var/www/binhs-coop-frontend, branch main)
#
# Staging deploys automatically on every push to `development`, so the client's
# staging box cannot silently fall behind the branch it tracks — it used to,
# because every deploy needed someone to remember to dispatch this by hand.
#
# Production stays manual on purpose: a person picks the moment a change
# reaches the client's live site. Note it tracks `main`, so merging to
# `development` alone never reaches production.
on:
  push:
    # development -> staging, main -> production. Production used to be
    # dispatch-only so a person could pick the moment; in practice that meant
    # the client's box sat behind main until someone remembered, which is the
    # failure this repo keeps hitting. main is protected and cannot take code
    # that has not passed CI, so the gate has not been removed — it moved to
    # the pull request, where it is enforced rather than remembered.
    branches: [development, main]
    # CI-only edits shouldn't redeploy anything.
    paths-ignore: ['.github/**']
  workflow_dispatch:
    inputs:
      environment:
        description: Which binhs-coop environment to deploy
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

# Never let two deploys interleave over the same checkout.
concurrency:
  # Per-deployment, NOT shared across workflows.
  #
  # A single shared group looked like it would serialize builds, but GitHub
  # cancels an older *pending* run when a newer one joins the same group even
  # with cancel-in-progress: false. With three deploys that silently dropped the
  # middle one — on 2026-08-25 `Deploy binhs-coop` was cancelled and the client's
  # production frontend simply never got the update.
  #
  # Serialization belongs on the box, not in GitHub: the deploy steps below take
  # an flock, so concurrent deploys queue instead of racing for memory. Queuing
  # is what we wanted; cancelling never was.
  group: deploy-binhs-coop-frontend-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
  cancel-in-progress: false

env:
  # push development -> staging, push main -> production; a dispatch may name
  # either explicitly.
  TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}

jobs:
  deploy:
    name: Deploy binhs-coop ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script: |
            set -euo pipefail

            if [ "${{ env.TARGET }}" = "production" ]; then
              APP=binhs-coop-frontend
            else
              APP=binhs-coop-frontend-staging
            fi

            # Hard gate. This was a warning-only tripwire on the stated grounds
            # that "deploy.sh recreates a missing pm2 entry" — but that is only
            # true of the lendyph-com-* scripts. binhs-coop's deploy.sh has no
            # `|| pm2 start` fallback, so a missing entry cannot be recovered
            # and warning-and-continuing just burns a full build before failing
            # at `pm2 restart` with a confusing error. Fail here instead, on the
            # client's path, before anything is spent.
            echo "=== Checking pm2 app '$APP' exists ==="
            pm2 describe "$APP" > /dev/null

            flock -w 2400 /var/lock/lendyph-frontend-build.lock bash "/var/www/$APP/deploy.sh"

            # A half-restarted Next server serves 500s perfectly happily.
            # Without this a deploy that leaves the client's site broken reports
            # green — which is exactly what this workflow did until recently.
            # deploy.sh now checks this too; kept here because that script is
            # unversioned and this is the copy that goes through review.
            echo "=== Verifying '$APP' is online ==="
            pm2 describe "$APP" | grep -q "status.*online"

            echo "=== binhs-coop ${{ env.TARGET }} deployed at $(date) ==="

      # The retry below used to fire ~2 min after the first attempt — inside the
      # same outage window — so both legs died together and the deploy shipped
      # nothing. Observed three times on 2026-08-19, each succeeding on a manual
      # re-run minutes later with nothing changed. The drops happen upstream of
      # the VPS: the errors quote the correct IP, ufw allows OpenSSH from
      # anywhere, fail2ban is not installed, and the box's own sshd journal has
      # no trace of the attempts. Waiting is the only lever we have from here.
      - name: Wait out the transient network window
        if: failure()
        run: sleep 240

      # The VPS has intermittently flaky inbound SSH (dial tcp :22 i/o timeout).
      # deploy.sh is idempotent, so retry once to ride out transient blips.
      - name: Deploy to VPS via SSH (retry on transient failure)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script: |
            set -euo pipefail

            if [ "${{ env.TARGET }}" = "production" ]; then
              APP=binhs-coop-frontend
            else
              APP=binhs-coop-frontend-staging
            fi

            # Hard gate. This was a warning-only tripwire on the stated grounds
            # that "deploy.sh recreates a missing pm2 entry" — but that is only
            # true of the lendyph-com-* scripts. binhs-coop's deploy.sh has no
            # `|| pm2 start` fallback, so a missing entry cannot be recovered
            # and warning-and-continuing just burns a full build before failing
            # at `pm2 restart` with a confusing error. Fail here instead, on the
            # client's path, before anything is spent.
            echo "=== Checking pm2 app '$APP' exists ==="
            pm2 describe "$APP" > /dev/null

            flock -w 2400 /var/lock/lendyph-frontend-build.lock bash "/var/www/$APP/deploy.sh"

            # A half-restarted Next server serves 500s perfectly happily.
            # Without this a deploy that leaves the client's site broken reports
            # green — which is exactly what this workflow did until recently.
            # deploy.sh now checks this too; kept here because that script is
            # unversioned and this is the copy that goes through review.
            echo "=== Verifying '$APP' is online ==="
            pm2 describe "$APP" | grep -q "status.*online"

            echo "=== binhs-coop ${{ env.TARGET }} deployed at $(date) ==="
