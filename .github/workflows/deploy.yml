name: Deploy Frontend

on:
  push:
    branches:
      - main
    # CI-only changes (e.g. adding the binhs-coop dispatch workflow) shouldn't
    # trigger an app deploy.
    paths-ignore:
      - '.github/**'

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/lendyph-app
            ./deploy.sh
