name: CI Checks

# Runs on PRs into a deployed branch and on pushes to those branches
# (development -> staging, main -> production), so the development -> main
# promotion and direct pushes are gated too — not just PRs into development.
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-check:
    name: Merge Conflict Check
    # PR-only: relies on PR context (issue number) and a base branch to
    # test-merge against, so it is skipped on the push triggers above.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The repository's default token is read-only, so the conflict comment
    # below (POST /issues/{number}/comments) was refused with a 403. This job
    # only needs to read the code and write that comment. The comment is on a
    # pull request, and GITHUB_TOKEN needs `pull-requests: write` for that:
    # `issues: write` alone was still refused (verified on #413).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Compare against the branch this PR actually targets. Hardcoding
      # `development` failed every hotfix cut from `main`: such a branch is
      # legitimately "behind development", and test-merging development into
      # it collides with whatever main has not taken yet — reporting a
      # conflict that cannot occur against the real base.
      - name: Check if branch is up-to-date with the base branch
        id: behind-check
        run: |
          git fetch origin "$BASE"
          BEHIND=$(git rev-list --count "HEAD..origin/$BASE")
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -gt 0 ]; then
            echo "::warning::Branch is $BEHIND commit(s) behind $BASE"
          fi
        env:
          BASE: ${{ github.base_ref }}

      # actions/checkout sets no git identity, and without one `git merge`
      # stops before computing anything (exit 128, "unable to auto-detect
      # email address"). This step used to treat that as a conflict, so every
      # PR whose base had moved since its merge ref was built was reported as
      # conflicting, with an empty file list. So the merge gets a throwaway
      # identity, and "conflict" means git left unmerged paths: a merge that
      # fails without any is an error in this job, not a conflict in the PR.
      - name: Test merge with the base branch
        id: merge-test
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE"
          LOG="$RUNNER_TEMP/merge.log"
          if git -c user.name=merge-check -c user.email=merge-check@localhost \
              merge --no-commit --no-ff "origin/$BASE" > "$LOG" 2>&1; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            CONFLICTS=$(git diff --name-only --diff-filter=U | paste -sd, -)
            if [ -z "$CONFLICTS" ]; then
              cat "$LOG"
              echo "::error::The test merge failed without leaving a conflict."
              exit 1
            fi
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "files=$CONFLICTS" >> "$GITHUB_OUTPUT"
          fi
          git merge --abort 2>/dev/null || true

      - name: Comment on PR if conflicts found
        # Dependabot's runs always get a read-only token, which the job's
        # `permissions` cannot raise, so its comment would still be refused.
        if: steps.merge-test.outputs.conflict == 'true' && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v9
        with:
          script: |
            const files = '${{ steps.merge-test.outputs.files }}';
            const behind = '${{ steps.behind-check.outputs.behind }}';
            const base = context.payload.pull_request.base.ref;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ **Merge conflicts detected** — this branch is ${behind} commit(s) behind \`${base}\`.\n\n**Conflicting files:**\n${files.split(',').map(f => '- \`' + f.trim() + '\`').join('\n')}\n\nPlease rebase onto \`${base}\` before merging:\n\`\`\`bash\ngit fetch origin ${base}\ngit rebase origin/${base}\n# resolve conflicts\ngit push --force-with-lease\n\`\`\``
            });

      - name: Fail if conflicts exist
        if: steps.merge-test.outputs.conflict == 'true'
        run: |
          echo "❌ This branch has merge conflicts with $BASE."
          echo "Rebase onto $BASE before merging."
          exit 1

  ci:
    name: TypeScript & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 22, not 20: `node --test` only learned to expand globs in 22, so
          # the unit-test step below silently matched nothing on 20. Node 20 is
          # also now deprecated on GitHub runners.
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Nothing had ever audited dependencies here, so 18 advisories accumulated
      # unseen — 9 of them high. Cleaning that up once only resets the clock;
      # this is what stops it recurring.
      #
      # Fails on high/critical only. Two moderate advisories are knowingly
      # accepted (exceljs pins uuid ^8.3.0 and no 4.x can widen it; the
      # vulnerable uuid path needs a caller-supplied `buf`, and exceljs calls
      # uuidv4() with no arguments inside a conditional-formatting serializer
      # this app never triggers). Failing on moderate would red every unrelated
      # PR over that, and a check that cries wolf is one people learn to ignore.
      - name: Audit npm dependencies
        run: |
          npm audit || true
          npm audit --audit-level=high

      # Every NEXT_PUBLIC_* used in src/ must be documented in .env.example.
      # A deployment cannot set a var it has never been told about, and these
      # values are inlined at build time — so an undocumented one becomes a
      # localhost default baked into a client's bundle.
      - name: Env contract check
        run: node scripts/check-env.mjs --docs-only

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      # These tests existed but had never run in CI, so a regression in the
      # report builders or ledger maths would have shipped green. The zero-test
      # guard matters as much as the run: a glob that matches nothing exits 0
      # and reads as success, which is how they stayed invisible.
      - name: Unit tests
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee /tmp/unit.log
          if ! grep -qE '^. tests [1-9]' /tmp/unit.log; then
            echo "::error::No unit tests ran — the glob matched nothing."
            exit 1
          fi

      # CI has no real .env, and `prebuild` refuses to build without the
      # required vars. Building against .env.example is the point: it proves the
      # documented contract is actually sufficient to produce a build.
      - name: Prepare environment
        run: cp .env.example .env

      - name: Production build
        run: npm run build
